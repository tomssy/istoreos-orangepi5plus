name: Build iStoreOS 25.12 for Orange Pi 5 Plus

on:
  schedule:
    - cron: '0 4 1 * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'iStoreOS 25.12 源码分支、标签或提交'
        required: true
        default: istoreos-25.12
        type: string

permissions:
  contents: read

concurrency:
  group: orangepi5plus-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      SOURCE_REF: ${{ inputs.source_ref || 'istoreos-25.12' }}
      TZ: Asia/Shanghai
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare runner
        run: bash scripts/build.sh prepare

      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/*') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/*') }}-

      - name: Fetch official sources and configure
        run: bash scripts/build.sh configure

      - name: Download sources
        timeout-minutes: 45
        run: bash scripts/build.sh download

      - name: Compile firmware
        timeout-minutes: 285
        run: bash scripts/build.sh compile

      - name: Collect and verify firmware
        run: bash scripts/build.sh collect

      - name: Upload firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iStoreOS-25.12-OrangePi5Plus-${{ github.run_number }}
          path: output/firmware/
          if-no-files-found: error
          retention-days: 45
          compression-level: 0

      - name: Collect diagnostic information
        if: always()
        run: |
          mkdir -p output/diagnostics
          df -h > output/diagnostics/disk-space.txt
          for file in feeds.conf feeds.conf.default; do
            if [[ -f "openwrt/$file" ]]; then cp "openwrt/$file" output/diagnostics/; fi
          done
          if [[ -f openwrt/.config ]]; then cp openwrt/.config output/diagnostics/resolved.config; fi
          if [[ -d openwrt/logs ]]; then cp -a openwrt/logs output/diagnostics/; fi
          for file in openwrt/build_dir/target-*/linux-*/linux-*/.config; do
            if [[ -f "$file" ]]; then cp "$file" output/diagnostics/kernel.config; fi
          done
          for file in openwrt/build_dir/target-*/linux-*/linux-*/Module.symvers; do
            if [[ -f "$file" ]]; then cp "$file" output/diagnostics/kernel.Module.symvers; fi
          done
          if [[ -d openwrt ]]; then git -C openwrt rev-parse HEAD > output/diagnostics/source-commit.txt || true; fi

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-logs-${{ github.run_number }}
          path: output/diagnostics/
          if-no-files-found: warn
          retention-days: 14

  record-monthly-build:
    name: Record monthly build result
    needs: build
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      BUILD_RESULT: ${{ needs.build.result }}
    steps:
      - name: Update monthly build record
        shell: python
        run: |
          import base64
          import datetime
          import json
          import os
          import subprocess

          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['DEFAULT_BRANCH']
          api = f'repos/{repo}/contents/.github/monthly-build.json'
          lookup = subprocess.run(['gh', 'api', f'{api}?ref={branch}'], capture_output=True, text=True)
          if lookup.returncode and 'HTTP 404' not in lookup.stderr:
              raise RuntimeError('Could not read the monthly build record: ' + lookup.stderr)
          now = datetime.datetime.now(datetime.timezone.utc)
          record = {
              'recorded_at': now.isoformat(),
              'source_ref': 'istoreos-25.12',
              'result': os.environ['BUILD_RESULT'],
              'run_url': f'https://github.com/{repo}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
          }
          body = {
              'message': f'Record monthly firmware build {now:%Y-%m}',
              'branch': branch,
              'content': base64.b64encode((json.dumps(record, indent=2) + '\n').encode()).decode(),
          }
          if lookup.returncode == 0:
              body['sha'] = json.loads(lookup.stdout)['sha']
          subprocess.run(['gh', 'api', '--method', 'PUT', api, '--input', '-'],
                         input=json.dumps(body), text=True, check=True, stdout=subprocess.DEVNULL)
          print('Monthly build result recorded.')
